data:
  ticker: "US30"
  start_date: "2024-01-01"
  end_date: "current"
  interval: "15m"
  source: "mt5"

features:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2
  sma_periods: [10, 20, 50, 200]
  ema_periods: [12, 26]
  atr_period: 14
  volume_sma_period: 20

model:
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  gamma: 0.1
  reg_alpha: 0.1
  reg_lambda: 1.0
  random_state: 42
  eval_metric: "logloss"
  early_stopping_rounds: 50
  test_size: 0.2
  validation_size: 0.1

signal:
  prediction_threshold: 0.45

target:
  type: "tp_before_sl"
  take_profit_points: 100
  stop_loss_points: 20
  max_bars: 40
  same_bar_rule: "drop"
  unresolved_policy: "drop"

instruments:
  US30:
    take_profit_points: 100
    stop_loss_points: 20
  DE40:
    take_profit_points: 100
    stop_loss_points: 20

risk:
  max_position_size: 0.1
  stop_loss: 0.02
  take_profit: 0.04
  max_drawdown: 0.15
  risk_per_trade: 0.01

backtest:
  initial_capital: 100000
  commission: 0.001
  slippage: 0.0005

# Active experiment: V0.3 forward-looking ATR target
# Historical V0.1/V0.2 configs are preserved in config/config_v01.yaml and config/config_v02.yaml.
data:
  ticker: "US30"
  start_date: "2022-05-12"
  end_date: "current"
  interval: "15m"
  source: "mt5"
  use_cache: true

features:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2
  sma_periods: [10, 20, 50, 200]
  ema_periods: [12, 26]
  atr_period: 14
  volume_sma_period: 20

model:
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  gamma: 0.1
  reg_alpha: 0.1
  reg_lambda: 1.0
  random_state: 42
  eval_metric: "logloss"
  early_stopping_rounds: 50
  test_size: 0.2
  validation_size: 0.1

signal:
  prediction_threshold: 0.55
  buy_threshold: 0.70
  sell_threshold: 0.70

experiment:
  target_mode: "v0.3_forward_atr"
  signal_mode: "v0.3_forward_atr"

target:
  type: "forward_atr"
  take_profit_points: 100
  stop_loss_points: 20
  max_bars: 40
  same_bar_rule: "conservative_sl"
  unresolved_policy: "drop"
  forward_horizon: 5
  atr_threshold_multiplier: 1.0

instruments:
  US30:
    take_profit_points: 100
    stop_loss_points: 20
  DE40:
    take_profit_points: 100
    stop_loss_points: 20

risk:
  max_position_size: 0.1
  stop_loss: 0.02
  take_profit: 0.04
  max_drawdown: 0.15
  risk_per_trade: 0.01

backtest:
  initial_capital: 100000
  commission: 0.001
  slippage: 0.0005

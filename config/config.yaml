data:
  ticker: "AAPL"
  start_date: "2018-01-01"
  end_date: "2024-01-01"
  interval: "1d"

features:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2
  sma_periods: [10, 20, 50, 200]
  ema_periods: [12, 26]
  atr_period: 14
  volume_sma_period: 20

model:
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  gamma: 0.1
  reg_alpha: 0.1
  reg_lambda: 1.0
  random_state: 42
  eval_metric: "logloss"
  early_stopping_rounds: 50
  test_size: 0.2
  validation_size: 0.1

signal:
  prediction_threshold: 0.55
  lookahead_days: 5
  return_threshold: 0.01

risk:
  max_position_size: 0.1
  stop_loss: 0.02
  take_profit: 0.04
  max_drawdown: 0.15
  risk_per_trade: 0.01

backtest:
  initial_capital: 100000
  commission: 0.001
  slippage: 0.0005
